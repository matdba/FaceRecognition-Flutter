name: facerecognition_flutter
description: A new Flutter project.


publish_to: 'none'


version: 1.0.0+1


environment:
  sdk: '>=3.0.2 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  facesdk_plugin:
    path: ./facesdk_plugin
  flutter_exif_rotation: ^0.5.1
  get: ^4.7.2
  image_picker: ^1.1.2
  fluttertoast: ^8.2.12
  shared_preferences: ^2.5.3
  path: ^1.9.0
  sqflite: ^2.4.1
  solar_icons: ^0.0.5
  persian_number_utility: ^1.1.6
  google_ml_kit: ^0.20.0
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.1
  google_mlkit_commons: ^0.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  settings_ui: ^2.0.2


flutter:

  uses-material-design: true

  assets:
    - assets/ic_kby.png
    - assets/ic_skype.png
    - assets/ic_telegram.png
    - assets/ic_whatsapp.png
    - assets/ic_github.png
    - assets/fonts/



  fonts:
    - family: Sans
      fonts:
        - asset: assets/fonts/iransans_black.ttf
        - asset: assets/fonts/iransans_bold.ttf
        - asset: assets/fonts/iransans_light.ttf
        - asset: assets/fonts/iransans_medium.ttf
        - asset: assets/fonts/iransans_ultra_light.ttf
        - asset: assets/fonts/iransans.ttf

    - family: SansFaNum
      fonts:
        - asset: assets/fonts/iransans_fanum.ttf
